<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>repo-pulse</title>
    <link rel="icon" id="favicon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --panel: #ffffff;
        --fg: #1b1d21;
        --muted: #6d7178;
        --faint: #a1a5ab;
        --line: #e7e8ea;
        --line-strong: #d6d8dc;
        --hover: #f1f2f4;
        --sel: #e9eefb;
        --add: #1f883d;
        --del: #cf222e;
        --new: #b35900;
        --mod: #0969da;
        --commit: #6f42c1;
        --head: #6d7178;
        --flash: rgba(9, 105, 218, 0.14);
        --add-bg: rgba(31, 136, 61, 0.1);
        --del-bg: rgba(207, 34, 46, 0.1);
        --hunk-bg: rgba(9, 105, 218, 0.07);
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
        --pill-bg: #1b1d21;
        --pill-fg: #ffffff;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --sans: ui-sans-serif, -apple-system, 'SF Pro Text', system-ui, sans-serif;
        --top-h: 48px;
        --foot-h: 30px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1114;
          --panel: #16181c;
          --fg: #e4e6ea;
          --muted: #8b9098;
          --faint: #5c6169;
          --line: #23262c;
          --line-strong: #2f333a;
          --hover: #1c1f24;
          --sel: #1e2634;
          --add: #3fb950;
          --del: #f85149;
          --new: #d29922;
          --mod: #58a6ff;
          --commit: #a371f7;
          --head: #8b9098;
          --flash: rgba(88, 166, 255, 0.18);
          --add-bg: rgba(63, 185, 80, 0.12);
          --del-bg: rgba(248, 81, 73, 0.12);
          --hunk-bg: rgba(88, 166, 255, 0.08);
          --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
          --pill-bg: #e4e6ea;
          --pill-fg: #0f1114;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1114;
        --panel: #16181c;
        --fg: #e4e6ea;
        --muted: #8b9098;
        --faint: #5c6169;
        --line: #23262c;
        --line-strong: #2f333a;
        --hover: #1c1f24;
        --sel: #1e2634;
        --add: #3fb950;
        --del: #f85149;
        --new: #d29922;
        --mod: #58a6ff;
        --commit: #a371f7;
        --head: #8b9098;
        --flash: rgba(88, 166, 255, 0.18);
        --add-bg: rgba(63, 185, 80, 0.12);
        --del-bg: rgba(248, 81, 73, 0.12);
        --hunk-bg: rgba(88, 166, 255, 0.08);
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        --pill-bg: #e4e6ea;
        --pill-fg: #0f1114;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      h1,
      h2 {
        margin: 0;
        font-weight: 600;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      [hidden] {
        display: none !important;
      }
      :focus-visible {
        outline: 2px solid var(--mod);
        outline-offset: 1px;
      }

      /* Top bar */
      .top {
        height: var(--top-h);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand h1 {
        font-size: 14px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .brand .root {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 28vw;
      }
      .live {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
        transition: background 0.3s;
        flex: none;
      }
      .live.on {
        background: var(--add);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.35);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(63, 185, 80, 0);
        }
      }
      .wts {
        display: flex;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: transparent;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .chip:hover {
        background: var(--hover);
      }
      .chip .sha {
        color: var(--faint);
      }
      .chip.hot {
        border-color: var(--add);
        color: var(--fg);
      }
      .chip.on {
        background: var(--sel);
        border-color: var(--mod);
        color: var(--fg);
      }
      .spacer {
        flex: 1;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        overflow: hidden;
        flex: none;
      }
      .seg button {
        background: transparent;
        border: 0;
        padding: 4px 9px;
        font-size: 12px;
        color: var(--muted);
      }
      .seg button + button {
        border-left: 1px solid var(--line);
      }
      .seg button.on {
        background: var(--sel);
        color: var(--fg);
      }
      .seg button:focus-visible {
        outline-offset: -2px;
      }
      .filter {
        width: 200px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--bg);
        outline: none;
        flex: none;
      }
      .filter:focus {
        border-color: var(--mod);
      }
      .filter::-webkit-search-cancel-button {
        cursor: pointer;
      }

      /* Panel tabs: only shown when the window is too narrow for columns */
      .tabs {
        display: none;
        height: 36px;
        padding: 0 8px;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .tabs button {
        border: 0;
        background: transparent;
        padding: 0 10px;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs button.on {
        color: var(--fg);
        border-bottom-color: var(--fg);
      }
      .tabs .count {
        font-family: var(--mono);
        color: var(--faint);
        margin-left: 5px;
        font-size: 11px;
      }

      /* Columns */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 38%);
        height: calc(100% - var(--top-h) - var(--foot-h));
      }
      .col {
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
      }
      .col + .col {
        border-left: 1px solid var(--line);
      }
      .side {
        display: grid;
        grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr);
      }
      .side > section {
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
      }
      .side > section + section {
        border-top: 1px solid var(--line);
      }
      h2 {
        display: flex;
        align-items: baseline;
        gap: 8px;
        height: 36px;
        padding: 10px 16px 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        flex: none;
      }
      h2 .count {
        font-family: var(--mono);
        font-weight: 400;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: none;
      }
      h2 .sum {
        margin-left: auto;
        font-family: var(--mono);
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0;
        text-transform: none;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      h2 .sum .a {
        color: var(--add);
      }
      h2 .sum .d {
        color: var(--del);
      }
      .list {
        outline: none;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding-bottom: 24px;
        flex: 1;
      }

      /* Rows */
      .row {
        display: grid;
        grid-template-columns: 56px 14px minmax(0, 1fr) 48px 92px 68px;
        align-items: center;
        gap: 10px;
        height: 28px;
        padding: 0 16px;
        border-left: 2px solid transparent;
        cursor: default;
        outline: none;
        font-variant-numeric: tabular-nums;
      }
      .row.clickable {
        cursor: pointer;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.selected {
        background: var(--sel);
      }
      .row.flash {
        animation: flash 1.6s ease-out;
      }
      @keyframes flash {
        from {
          background: var(--flash);
        }
        to {
          background: transparent;
        }
      }
      .row .time {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
      }
      .row .time.rep {
        opacity: 0.3;
      }
      .row .glyph {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        justify-self: center;
      }
      .k-created .glyph {
        background: var(--new);
      }
      .k-modified .glyph {
        background: var(--mod);
      }
      .k-renamed .glyph {
        background: var(--mod);
        box-shadow: inset 0 0 0 2px var(--panel);
      }
      .k-deleted .glyph {
        background: var(--del);
      }
      .k-reverted .glyph {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--faint);
      }
      .k-commit .glyph {
        background: var(--commit);
        border-radius: 2px;
      }
      .k-head .glyph {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--head);
        border-radius: 2px;
      }
      .row .what {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .what.path {
        font-family: var(--mono);
        font-size: 12px;
      }
      .what .dir {
        color: var(--muted);
      }
      .what .base {
        color: var(--fg);
      }
      .what .verb {
        font-family: var(--sans);
        color: var(--muted);
        font-size: 11.5px;
        margin-left: 6px;
      }
      .what .pill {
        display: inline-block;
        padding: 0 5px;
        margin-right: 6px;
        border-radius: 4px;
        background: var(--sel);
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--commit);
      }
      .what b {
        font-weight: 600;
        color: var(--commit);
      }
      .row .net {
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }
      .net.pos {
        color: var(--add);
      }
      .net.neg {
        color: var(--del);
      }
      .net.zero {
        color: var(--faint);
        font-weight: 400;
      }
      .net.n {
        color: var(--muted);
        font-weight: 400;
      }
      .row .tot {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
        text-align: right;
        white-space: nowrap;
      }
      .tot .a {
        color: var(--add);
        opacity: 0.75;
      }
      .tot .d {
        color: var(--del);
        opacity: 0.75;
      }
      .bar {
        display: flex;
        height: 6px;
        gap: 1px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 1px;
      }
      .bar .a {
        background: var(--add);
      }
      .bar .d {
        background: var(--del);
      }
      .group {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 8px 16px 3px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
        background: var(--bg);
      }
      .side .list {
        background: var(--panel);
      }
      .side .group {
        background: var(--panel);
      }
      .more {
        padding: 10px 16px;
        font-size: 11.5px;
        color: var(--faint);
      }

      /* New-rows pill: the feed does not move under a reader who has scrolled down */
      .newpill {
        position: absolute;
        top: 44px;
        left: 50%;
        transform: translateX(-50%);
        height: 26px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: var(--pill-bg);
        color: var(--pill-fg);
        font-size: 12px;
        font-weight: 500;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        z-index: 2;
        animation: drop 0.18s ease-out;
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translate(-50%, -6px);
        }
      }

      /* Tree rows carry heat: recent = solid, old = faded */
      .tree .row {
        grid-template-columns: 14px minmax(0, 1fr) 92px 68px 34px;
      }
      .tree .row .what {
        opacity: calc(0.42 + 0.58 * var(--heat, 0));
      }
      .row .age {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
        text-align: right;
      }
      .tree .row.hot .glyph {
        animation: breathe 2.4s ease-in-out infinite;
      }

      /* Work items */
      .items .row {
        grid-template-columns: 74px minmax(0, 1fr) 92px 68px 34px;
      }
      .items .id {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 12px;
      }
      .items .id.unlabeled {
        color: var(--faint);
        font-weight: 400;
      }
      .items .sub {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .items .row.on {
        background: var(--sel);
      }

      /* Empty / loading */
      .empty {
        padding: 48px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .empty .path {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 6px;
      }
      .skeleton .row {
        pointer-events: none;
      }
      .skeleton .sk {
        height: 10px;
        border-radius: 5px;
        background: var(--line);
      }

      /* Stats view */
      .dash {
        height: calc(100% - var(--top-h) - var(--foot-h));
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 16px 16px 40px;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 12px;
        align-content: start;
      }
      .card {
        grid-column: span 4;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px 10px;
        min-width: 0;
      }
      .card.wide {
        grid-column: span 8;
      }
      .card.full {
        grid-column: span 12;
      }
      .card.half {
        grid-column: span 6;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .card h3 .sub {
        margin-left: auto;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        color: var(--faint);
        font-family: var(--mono);
      }
      .tiles {
        grid-column: span 12;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .tile {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px 8px;
        min-width: 0;
      }
      .tile .label {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile .value {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
        margin-top: 2px;
        white-space: nowrap;
      }
      .tile .value .a {
        color: var(--add);
      }
      .tile .value .d {
        color: var(--del);
      }
      .tile .value small {
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
        margin-left: 4px;
      }
      .tile .hint {
        font-size: 11px;
        color: var(--faint);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile .spark {
        display: block;
        width: 100%;
        height: 22px;
        margin-top: 6px;
      }
      .chart {
        display: block;
        width: 100%;
        overflow: visible;
        font-family: var(--mono);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      .chart .grid-line {
        stroke: var(--line);
        stroke-width: 1;
      }
      .chart .axis {
        fill: var(--faint);
      }
      .chart .add {
        fill: var(--add);
      }
      .chart .del {
        fill: var(--del);
      }
      .chart .commit {
        fill: var(--commit);
      }
      .chart .line {
        fill: none;
        stroke: var(--mod);
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .chart .area {
        fill: var(--mod);
        opacity: 0.1;
      }
      .chart .dot {
        fill: var(--mod);
        stroke: var(--panel);
        stroke-width: 2;
      }
      .chart .hit {
        fill: transparent;
      }
      .chart .hit:hover {
        fill: var(--flash);
      }
      .bars {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        row-gap: 5px;
        column-gap: 10px;
        align-items: center;
      }
      .bars .name {
        font-family: var(--mono);
        font-size: 11.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bars .name .track {
        flex: none;
        height: 8px;
        border-radius: 0 4px 4px 0;
        background: var(--mod);
        min-width: 2px;
      }
      .bars .name .track.test {
        background: var(--commit);
      }
      .bars .n {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .bars .n .a {
        color: var(--add);
      }
      .bars .n .d {
        color: var(--del);
      }
      .stack {
        display: flex;
        height: 10px;
        gap: 2px;
        border-radius: 5px;
        overflow: hidden;
        margin: 6px 0 8px;
      }
      .stack i {
        display: block;
        height: 100%;
        min-width: 2px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .dash .empty {
        grid-column: span 12;
      }
      .tip {
        position: fixed;
        z-index: 20;
        pointer-events: none;
        background: var(--pill-bg);
        color: var(--pill-fg);
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.5;
        padding: 6px 9px;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        white-space: nowrap;
        transform: translate(-50%, calc(-100% - 10px));
      }
      .tip .a {
        color: #3fb950;
      }
      .tip .d {
        color: #f85149;
      }

      /* Footer status bar */
      .foot {
        height: var(--foot-h);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .foot .status {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .foot .status.down {
        color: var(--del);
      }
      .foot .keys {
        margin-left: auto;
        display: flex;
        gap: 12px;
        color: var(--faint);
      }
      .foot kbd {
        font-family: var(--mono);
        font-size: 10.5px;
        padding: 0 4px;
        border: 1px solid var(--line-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        color: var(--muted);
      }
      .foot .theme {
        border: 0;
        background: transparent;
        padding: 2px 6px;
        border-radius: 5px;
        color: var(--faint);
        font-size: 11px;
      }
      .foot .theme:hover {
        background: var(--hover);
        color: var(--fg);
      }

      /* Drawer */
      .drawer {
        position: fixed;
        top: var(--top-h);
        right: 0;
        bottom: var(--foot-h);
        width: min(62vw, 960px);
        min-width: 420px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line-strong);
        box-shadow: var(--shadow);
        transform: translateX(8px);
        opacity: 0;
        transition:
          transform 0.16s ease-out,
          opacity 0.16s ease-out;
        z-index: 5;
      }
      .drawer.open {
        transform: none;
        opacity: 1;
      }
      .drawer header {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .drawer .title {
        font-family: var(--mono);
        font-size: 12px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .drawer .stats {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .drawer .stats .a {
        color: var(--add);
      }
      .drawer .stats .d {
        color: var(--del);
      }
      .drawer .actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .btn {
        white-space: nowrap;
        flex: none;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
        font-size: 12px;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn.tog {
        color: var(--muted);
      }
      .btn.tog.on {
        background: var(--sel);
        color: var(--fg);
        border-color: var(--mod);
      }
      .btn.icon {
        width: 26px;
        padding: 0;
        font-size: 15px;
        line-height: 1;
        color: var(--muted);
      }
      .seg.small button {
        padding: 3px 8px;
        font-size: 11.5px;
      }

      /* Rendered markdown with the diff painted on */
      .prose {
        flex: 1;
        overflow: auto;
        padding: 20px 28px 48px;
        font-size: 13.5px;
        line-height: 1.6;
        max-width: 100%;
      }
      .prose > * {
        max-width: 78ch;
      }
      .prose h1,
      .prose h2,
      .prose h3,
      .prose h4,
      .prose h5,
      .prose h6 {
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
        margin: 1.6em 0 0.5em;
      }
      .prose > :first-child {
        margin-top: 0;
      }
      .prose h1 {
        font-size: 20px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .prose h2 {
        font-size: 16px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--line);
      }
      .prose h3 {
        font-size: 14px;
      }
      .prose h4,
      .prose h5,
      .prose h6 {
        font-size: 13px;
        color: var(--muted);
      }
      .prose p {
        margin: 0 0 0.9em;
      }
      .prose ul,
      .prose ol {
        margin: 0 0 0.9em;
        padding-left: 1.5em;
      }
      .prose li {
        margin: 0.15em 0;
      }
      .prose li ul,
      .prose li ol {
        margin: 0.15em 0 0;
      }
      .prose li.task {
        list-style: none;
        margin-left: -1.5em;
        padding-left: 1.5em;
        text-indent: -1.5em;
      }
      .prose li.task input {
        margin: 0 0.5em 0 0;
        vertical-align: -1px;
        accent-color: var(--add);
      }
      .prose li.task.done {
        color: var(--muted);
      }
      .prose li.task.done ins {
        color: var(--fg);
      }
      .prose code {
        font-family: var(--mono);
        font-size: 0.92em;
        background: var(--hover);
        padding: 1px 4px;
        border-radius: 4px;
      }
      .prose pre {
        margin: 0 0 0.9em;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--bg);
        border: 1px solid var(--line);
        overflow-x: auto;
        font: 11.5px/1.5 var(--mono);
      }
      .prose pre code {
        background: none;
        padding: 0;
        font-size: inherit;
        display: block;
        white-space: pre;
      }
      .prose pre code .ins {
        background: var(--add-bg);
        display: inline-block;
        width: 100%;
      }
      .prose blockquote {
        margin: 0 0 0.9em;
        padding: 2px 14px;
        border-left: 3px solid var(--line-strong);
        color: var(--muted);
      }
      .prose blockquote p {
        margin: 0;
      }
      .prose hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 1.4em 0;
      }
      .prose a {
        color: var(--mod);
        text-decoration: none;
      }
      .prose a:hover {
        text-decoration: underline;
      }
      .prose table {
        border-collapse: collapse;
        margin: 0 0 0.9em;
        font-size: 12.5px;
      }
      .prose th,
      .prose td {
        border: 1px solid var(--line);
        padding: 4px 10px;
        text-align: left;
        vertical-align: top;
      }
      .prose th {
        background: var(--hover);
        font-weight: 600;
      }
      .prose ins {
        text-decoration: none;
        background: var(--add-bg);
        box-shadow: 0 0 0 2px var(--add-bg);
        border-radius: 2px;
      }
      .prose tr.ins-row td {
        background: var(--add-bg);
      }
      .prose .ins-block {
        position: relative;
      }
      .prose .ins-block::before {
        content: '';
        position: absolute;
        left: -14px;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 2px;
        background: var(--add);
        opacity: 0.8;
      }
      .prose del.gone {
        display: block;
        margin: 0 0 0.6em;
        padding: 2px 10px;
        border-left: 3px solid var(--del);
        background: var(--del-bg);
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--del);
        font-size: 12.5px;
        white-space: pre-wrap;
        border-radius: 0 4px 4px 0;
      }
      .prose .empty {
        padding-top: 8px;
        text-align: left;
      }

      .files {
        display: flex;
        gap: 4px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        flex: none;
        scrollbar-width: none;
      }
      .files button {
        border: 0;
        background: transparent;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .files button:hover {
        background: var(--hover);
        color: var(--fg);
      }
      .diff {
        margin: 0;
        flex: 1;
        overflow: auto;
        font: 11.5px/1.5 var(--mono);
        padding: 0 0 32px;
        tab-size: 4;
        font-variant-numeric: tabular-nums;
      }
      .diff .l {
        display: grid;
        grid-template-columns: 40px 40px minmax(0, 1fr);
        white-space: pre;
      }
      .diff .ln {
        text-align: right;
        padding-right: 8px;
        color: var(--faint);
        user-select: none;
        opacity: 0.7;
      }
      .diff .code {
        padding: 0 14px 0 8px;
      }
      .diff.wrap .l {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .diff.wrap .l.file .code {
        white-space: pre-wrap;
      }
      .diff .l.add {
        background: var(--add-bg);
      }
      .diff .l.del {
        background: var(--del-bg);
      }
      .diff .l.hunk {
        background: var(--hunk-bg);
        color: var(--mod);
        margin-top: 6px;
      }
      .diff .l.hunk .code,
      .diff .l.meta .code,
      .diff .l.head .code,
      .diff .l.file .code {
        grid-column: 1 / -1;
        padding-left: 14px;
      }
      .diff .l.meta {
        color: var(--faint);
      }
      .diff .l.head {
        color: var(--muted);
      }
      .diff .l.head:first-child {
        padding-top: 8px;
      }
      .diff .l.file {
        position: sticky;
        top: 0;
        z-index: 1;
        color: var(--fg);
        font-weight: 600;
        background: var(--panel);
        padding: 8px 0 4px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .diff .l.file:first-child {
        border-top: 0;
      }
      .diff .loading,
      .diff .err {
        padding: 24px 14px;
        color: var(--muted);
        font-family: var(--sans);
      }

      @media (max-width: 960px) {
        .brand .root {
          display: none;
        }
        .top {
          gap: 8px;
        }
        .filter {
          width: 150px;
        }
        .tabs {
          display: flex;
        }
        .grid {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr);
          height: calc(100% - var(--top-h) - 36px - var(--foot-h));
        }
        .col + .col {
          border-left: 0;
        }
        /* The side column dissolves so its sections become the grid's own panels. */
        .side {
          display: contents;
        }
        .grid > .feed:not(.on),
        .side > section:not(.on) {
          display: none;
        }
        .side > section + section {
          border-top: 0;
        }
        .side > section > h2 {
          display: none;
        }
        .feed > h2 {
          display: none;
        }
        .foot .keys {
          display: none;
        }
        .drawer {
          width: 100%;
          min-width: 0;
        }
        .seg.view {
          display: none;
        }
        .dash {
          height: calc(100% - var(--top-h) - 36px - var(--foot-h));
          padding: 12px 12px 40px;
        }
        .card,
        .card.wide,
        .card.half {
          grid-column: span 12;
        }
      }
      @media (min-width: 961px) and (max-width: 1400px) {
        .card {
          grid-column: span 6;
        }
        .card.wide {
          grid-column: span 12;
        }
      }
      @media (max-width: 640px) {
        .wts {
          display: none;
        }
        .seg button {
          padding: 4px 7px;
        }
        .filter {
          width: 120px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .live.on,
        .tree .row.hot .glyph,
        .row.flash,
        .newpill {
          animation: none;
        }
        .drawer {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="live" id="live" title="Connection"></span>
        <h1 id="repo">repo-pulse</h1>
        <span class="root" id="root"></span>
      </div>
      <div class="wts" id="wts"></div>
      <div class="spacer"></div>
      <div class="seg view" id="view" role="group" aria-label="View">
        <button data-view="feed" class="on">Feed</button>
        <button data-view="stats">Stats</button>
      </div>
      <div class="seg" id="window" role="group" aria-label="Time window">
        <button data-w="900000">15m</button>
        <button data-w="3600000" class="on">1h</button>
        <button data-w="10800000">3h</button>
        <button data-w="86400000">24h</button>
        <button data-w="0">all</button>
      </div>
      <input
        class="filter"
        id="filter"
        type="search"
        placeholder="Filter paths or commits"
        aria-label="Filter"
      />
    </header>
    <nav class="tabs" id="tabs" aria-label="Panels">
      <button data-panel="feed" class="on">
        Activity<span class="count" id="tab-feed"></span>
      </button>
      <button data-panel="tree">Working tree<span class="count" id="tab-tree"></span></button>
      <button data-panel="items">Work items<span class="count" id="tab-items"></span></button>
      <button data-panel="stats">Stats</button>
    </nav>
    <main class="grid">
      <section class="col feed on" id="panel-feed">
        <h2>
          Activity <span class="count" id="feed-count"></span>
          <span class="sum" id="feed-sum"></span>
        </h2>
        <div class="list" id="feed" tabindex="0" aria-label="Activity feed"></div>
        <button class="newpill" id="newpill" hidden></button>
      </section>
      <aside class="col side">
        <section class="tree" id="panel-tree">
          <h2>Working tree <span class="count" id="tree-count"></span></h2>
          <div class="list" id="tree"></div>
        </section>
        <section class="items" id="panel-items">
          <h2>Work items <span class="count" id="items-count"></span></h2>
          <div class="list" id="items"></div>
        </section>
      </aside>
    </main>
    <section class="dash" id="panel-stats" hidden aria-label="Stats"></section>
    <div class="tip" id="tip" hidden></div>
    <footer class="foot">
      <span class="status" id="status">connecting…</span>
      <span class="keys" aria-hidden="true">
        <span><kbd>j</kbd> <kbd>k</kbd> move</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>/</kbd> filter</span>
        <span><kbd>esc</kbd> close</span>
      </span>
      <button class="theme" id="theme" title="Theme">auto</button>
    </footer>
    <div class="drawer" id="drawer" hidden role="dialog" aria-label="Diff">
      <header>
        <div class="title" id="drawer-title"></div>
        <div class="stats" id="drawer-stats"></div>
        <div class="actions">
          <div class="seg small" id="mode" role="group" aria-label="View" hidden>
            <button data-mode="rendered" class="on">Rendered</button>
            <button data-mode="diff">Diff</button>
          </div>
          <button class="btn tog" id="wrap-btn" aria-pressed="true" title="Wrap long lines">
            wrap
          </button>
          <button class="btn" id="cmux-btn" hidden>Open in cmux</button>
          <button class="btn icon" id="drawer-close" aria-label="Close" title="Close (esc)">
            ×
          </button>
        </div>
      </header>
      <nav class="files" id="drawer-files" hidden></nav>
      <pre class="diff" id="diff"></pre>
      <div class="prose" id="prose" hidden></div>
    </div>
    <script type="module" src="/pulse.js"></script>
  </body>
</html>

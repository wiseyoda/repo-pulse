<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>repo-pulse</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --panel: #ffffff;
        --fg: #1b1d21;
        --muted: #6d7178;
        --faint: #a1a5ab;
        --line: #e7e8ea;
        --line-strong: #d6d8dc;
        --hover: #f1f2f4;
        --sel: #e9eefb;
        --add: #1f883d;
        --del: #cf222e;
        --new: #b35900;
        --mod: #0969da;
        --commit: #6f42c1;
        --head: #6d7178;
        --flash: rgba(9, 105, 218, 0.14);
        --add-bg: rgba(31, 136, 61, 0.12);
        --del-bg: rgba(207, 34, 46, 0.12);
        --hunk-bg: rgba(9, 105, 218, 0.08);
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --sans: ui-sans-serif, -apple-system, 'SF Pro Text', system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1114;
          --panel: #16181c;
          --fg: #e4e6ea;
          --muted: #8b9098;
          --faint: #5c6169;
          --line: #23262c;
          --line-strong: #2f333a;
          --hover: #1c1f24;
          --sel: #1e2634;
          --add: #3fb950;
          --del: #f85149;
          --new: #d29922;
          --mod: #58a6ff;
          --commit: #a371f7;
          --head: #8b9098;
          --flash: rgba(88, 166, 255, 0.18);
          --add-bg: rgba(63, 185, 80, 0.14);
          --del-bg: rgba(248, 81, 73, 0.14);
          --hunk-bg: rgba(88, 166, 255, 0.1);
          --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1114;
        --panel: #16181c;
        --fg: #e4e6ea;
        --muted: #8b9098;
        --faint: #5c6169;
        --line: #23262c;
        --line-strong: #2f333a;
        --hover: #1c1f24;
        --sel: #1e2634;
        --add: #3fb950;
        --del: #f85149;
        --new: #d29922;
        --mod: #58a6ff;
        --commit: #a371f7;
        --head: #8b9098;
        --flash: rgba(88, 166, 255, 0.18);
        --add-bg: rgba(63, 185, 80, 0.14);
        --del-bg: rgba(248, 81, 73, 0.14);
        --hunk-bg: rgba(88, 166, 255, 0.1);
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      h1,
      h2 {
        margin: 0;
        font-weight: 600;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }

      /* Top bar */
      .top {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand h1 {
        font-size: 14px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .brand .root {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 32vw;
      }
      .live {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
        box-shadow: 0 0 0 0 transparent;
        transition: background 0.3s;
        flex: none;
      }
      .live.on {
        background: var(--add);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.35);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(63, 185, 80, 0);
        }
      }
      .wts {
        display: flex;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .chip .sha {
        color: var(--faint);
      }
      .chip.hot {
        border-color: var(--add);
        color: var(--fg);
      }
      .spacer {
        flex: 1;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        overflow: hidden;
      }
      .seg button {
        background: transparent;
        border: 0;
        padding: 4px 9px;
        font-size: 12px;
        color: var(--muted);
      }
      .seg button + button {
        border-left: 1px solid var(--line);
      }
      .seg button.on {
        background: var(--sel);
        color: var(--fg);
      }
      .filter {
        width: 200px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--bg);
        outline: none;
      }
      .filter:focus {
        border-color: var(--mod);
      }

      /* Columns */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 38%);
        height: calc(100% - 48px);
      }
      .col {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .col + .col {
        border-left: 1px solid var(--line);
      }
      .side {
        display: grid;
        grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr);
      }
      .side > section {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .side > section + section {
        border-top: 1px solid var(--line);
      }
      h2 {
        display: flex;
        align-items: baseline;
        gap: 8px;
        height: 36px;
        padding: 10px 16px 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        flex: none;
      }
      h2 .count {
        font-family: var(--mono);
        font-weight: 400;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: none;
      }
      .list {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding-bottom: 24px;
      }

      /* Rows */
      .row {
        display: grid;
        grid-template-columns: 58px 14px minmax(0, 1fr) auto 68px;
        align-items: center;
        gap: 10px;
        height: 28px;
        padding: 0 16px;
        border-left: 2px solid transparent;
        cursor: default;
        outline: none;
      }
      .row.clickable {
        cursor: pointer;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.selected {
        background: var(--sel);
      }
      .row.flash {
        animation: flash 1.6s ease-out;
      }
      @keyframes flash {
        from {
          background: var(--flash);
        }
        to {
          background: transparent;
        }
      }
      .row .time {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
      }
      .row .glyph {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        justify-self: center;
      }
      .k-created .glyph {
        background: var(--new);
      }
      .k-modified .glyph {
        background: var(--mod);
      }
      .k-renamed .glyph {
        background: var(--mod);
        box-shadow: inset 0 0 0 2px var(--panel);
      }
      .k-deleted .glyph {
        background: var(--del);
      }
      .k-reverted .glyph {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--faint);
      }
      .k-commit .glyph {
        background: var(--commit);
        border-radius: 2px;
      }
      .k-head .glyph {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--head);
        border-radius: 2px;
      }
      .row .what {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .what .dir {
        color: var(--muted);
      }
      .what .base {
        color: var(--fg);
      }
      .what .verb {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
      }
      .what .pill {
        display: inline-block;
        padding: 0 5px;
        margin-right: 6px;
        border-radius: 4px;
        background: var(--sel);
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--commit);
      }
      .what b {
        font-weight: 600;
        color: var(--commit);
      }
      .row .delta {
        font-family: var(--mono);
        font-size: 11.5px;
        text-align: right;
        white-space: nowrap;
      }
      .delta .net {
        font-weight: 600;
      }
      .delta .net.pos {
        color: var(--add);
      }
      .delta .net.neg {
        color: var(--del);
      }
      .delta .net.zero {
        color: var(--faint);
      }
      .delta .tot {
        color: var(--faint);
        margin-left: 6px;
      }
      .delta .tot .a {
        color: var(--add);
        opacity: 0.8;
      }
      .delta .tot .d {
        color: var(--del);
        opacity: 0.8;
      }
      .bar {
        display: flex;
        height: 6px;
        gap: 1px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 1px;
      }
      .bar .a {
        background: var(--add);
      }
      .bar .d {
        background: var(--del);
      }
      .bar .n {
        background: var(--commit);
      }
      .group {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 8px 16px 3px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
        background: var(--bg);
      }
      .feed .group {
        background: var(--bg);
      }
      .side .list {
        background: var(--panel);
      }
      .side .group {
        background: var(--panel);
      }
      .side .group {
        text-transform: none;
      }
      .side .group .n {
        color: var(--faint);
      }
      .side .group .stat {
        float: right;
      }

      /* Tree rows carry heat: recent = solid, old = faded */
      .tree .row {
        grid-template-columns: 14px minmax(0, 1fr) auto 68px 34px;
      }
      .tree .row .what {
        opacity: calc(0.42 + 0.58 * var(--heat, 0));
      }
      .tree .row .age {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
        text-align: right;
      }
      .tree .row.hot .glyph {
        animation: breathe 2.4s ease-in-out infinite;
      }

      /* Work items */
      .items .row {
        grid-template-columns: 74px minmax(0, 1fr) auto 68px 34px;
      }
      .items .id {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 12px;
      }
      .items .id.unlabeled {
        color: var(--faint);
        font-weight: 400;
      }
      .items .sub {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .items .age {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
        text-align: right;
      }

      /* Empty / loading */
      .empty {
        padding: 48px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .empty .path {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 6px;
      }
      .skeleton .row {
        pointer-events: none;
      }
      .skeleton .sk {
        height: 10px;
        border-radius: 5px;
        background: var(--line);
      }

      /* Drawer */
      .drawer {
        position: fixed;
        top: 48px;
        right: 0;
        bottom: 0;
        width: min(60vw, 900px);
        min-width: 420px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line-strong);
        box-shadow: var(--shadow);
        transform: translateX(8px);
        opacity: 0;
        transition:
          transform 0.16s ease-out,
          opacity 0.16s ease-out;
        z-index: 5;
      }
      .drawer[hidden] {
        display: none;
      }
      .drawer.open {
        transform: none;
        opacity: 1;
      }
      .drawer header {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .drawer .title {
        font-family: var(--mono);
        font-size: 12px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .drawer .stats {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .drawer .stats .a {
        color: var(--add);
      }
      .drawer .stats .d {
        color: var(--del);
      }
      .drawer .actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .btn {
        white-space: nowrap;
        flex: none;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
        font-size: 12px;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn.kbd {
        font-family: var(--mono);
        color: var(--muted);
      }
      .diff {
        margin: 0;
        flex: 1;
        overflow: auto;
        font: 11.5px/1.5 var(--mono);
        padding: 8px 0 32px;
        tab-size: 4;
      }
      .diff .l {
        display: block;
        padding: 0 14px;
        white-space: pre;
      }
      .diff .l.add {
        background: var(--add-bg);
      }
      .diff .l.del {
        background: var(--del-bg);
      }
      .diff .l.hunk {
        background: var(--hunk-bg);
        color: var(--mod);
        margin-top: 8px;
      }
      .diff .l.meta {
        color: var(--faint);
      }
      .diff .l.file {
        color: var(--fg);
        font-weight: 600;
        margin-top: 14px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      .diff .l.file:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }
      .diff .loading {
        padding: 24px 14px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }
        .top {
          height: auto;
          flex-wrap: wrap;
          padding: 8px 16px;
          gap: 10px;
        }
        .brand .root {
          display: none;
        }
        .grid {
          grid-template-columns: 1fr;
          height: auto;
        }
        .col + .col {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .side {
          grid-template-rows: auto auto;
        }
        .list {
          overflow: visible;
        }
        .drawer {
          width: 100%;
          min-width: 0;
          top: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="live" id="live" title="Connection"></span>
        <h1 id="repo">repo-pulse</h1>
        <span class="root" id="root"></span>
      </div>
      <div class="wts" id="wts"></div>
      <div class="spacer"></div>
      <div class="seg" id="window" role="group" aria-label="Time window">
        <button data-w="900000">15m</button>
        <button data-w="3600000" class="on">1h</button>
        <button data-w="10800000">3h</button>
        <button data-w="86400000">24h</button>
        <button data-w="0">all</button>
      </div>
      <input
        class="filter"
        id="filter"
        type="search"
        placeholder="Filter paths or commits"
        aria-label="Filter"
      />
    </header>
    <main class="grid">
      <section class="col feed">
        <h2>Activity <span class="count" id="feed-count"></span></h2>
        <div class="list" id="feed" tabindex="0"></div>
      </section>
      <aside class="col side">
        <section class="tree">
          <h2>Working tree <span class="count" id="tree-count"></span></h2>
          <div class="list" id="tree"></div>
        </section>
        <section class="items">
          <h2>Work items <span class="count" id="items-count"></span></h2>
          <div class="list" id="items"></div>
        </section>
      </aside>
    </main>
    <div class="drawer" id="drawer" hidden role="dialog" aria-label="Diff">
      <header>
        <div class="title" id="drawer-title"></div>
        <div class="stats" id="drawer-stats"></div>
        <div class="actions">
          <button class="btn" id="cmux-btn" hidden>Open in cmux</button>
          <button class="btn kbd" id="drawer-close" aria-label="Close">esc</button>
        </div>
      </header>
      <pre class="diff" id="diff"></pre>
    </div>
    <script type="module" src="/pulse.js"></script>
  </body>
</html>
